<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#013A40">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Klantscan">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Klantbeeldscan</title>
<style>
/* Klantbeeldscan — huisstijl: donkerteal, oranje accent, Avenir Next */
:root{
  --bg:#013A40;
  --surface:#0B4851;
  --surface-2:#093F47;
  --surface-muted:#093F47;
  --surface-warm:#3B3115;
  --text:#FFFFFF;
  --text-muted:#BFE9E7;
  --primary:#028090;
  --secondary:#19B4A3;
  --accent:#F2A93C;
  --on-accent:#013A40;
  --border:#028090;
  --border-soft:#0B6670;
  --critical:#FF9C8F;
  --critical-bg:#3A2121;
  --warn-ink:#F2A93C;
  --radius-s:10px;
  --radius-m:16px;
  --radius-l:22px;
  --font:"Avenir Next",Avenir,"Nunito Sans","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  font-size:16px;
  line-height:1.5;
  min-height:100vh;
  padding:env(safe-area-inset-top) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));
  touch-action:manipulation;
  overscroll-behavior-y:none;
}
h1,h2,h3,h4{font-family:var(--font);color:var(--text);margin:0;text-wrap:pretty;}
h1{font-size:clamp(28px,7vw,40px);font-weight:400;line-height:1.15;}
h2{font-size:clamp(22px,5.5vw,28px);font-weight:500;line-height:1.2;}
h3{font-size:19px;font-weight:600;}
p{margin:0;}
button{font-family:inherit;font-size:inherit;}
::selection{background:var(--accent);color:var(--on-accent);}

#app{max-width:1040px;margin:0 auto;padding-block:12px 40px;}
#app.has-nav{padding-bottom:calc(120px + env(safe-area-inset-bottom));}

/* ---------- kop + reislijn ---------- */
.topbar{display:grid;gap:14px;margin-bottom:20px;}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:500;letter-spacing:.01em;}
.brand .dot{width:12px;height:12px;border-radius:50%;background:var(--accent);flex:none;}
.gear{
  width:44px;height:44px;border-radius:50%;flex:none;cursor:pointer;
  background:transparent;border:2px solid var(--border);color:#fff;
  display:grid;place-items:center;
}
.gear:active{background:var(--surface);}
.trail{
  position:relative;display:flex;align-items:center;justify-content:space-between;
  height:34px;max-width:640px;padding-right:24px;
}
.trail::before{
  content:"";position:absolute;left:0;right:14px;top:50%;height:4px;margin-top:-2px;
  background:var(--secondary);border-radius:2px;
}
.trail-arrow{
  position:absolute;right:0;top:50%;margin-top:-13px;width:0;height:0;
  border-left:20px solid var(--secondary);border-top:13px solid transparent;border-bottom:13px solid transparent;
}
.step{
  position:relative;width:26px;height:26px;border-radius:50%;flex:none;
  background:var(--bg);border:2px solid var(--secondary);color:var(--text-muted);
  font-size:11px;font-weight:700;display:grid;place-items:center;
}
.step.done{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
.step.current{
  background:var(--accent);border-color:var(--accent);color:var(--on-accent);
  box-shadow:0 0 0 4px rgba(242,169,60,.3);transform:scale(1.15);
}

/* ---------- kaarten ---------- */
.card{
  background:var(--surface);
  border:2px solid var(--border);
  border-radius:var(--radius-l);
  padding:28px;
}
@media (max-width:560px){.card{padding:20px 18px;}}
.card + .card{margin-top:16px;}
.center-col{max-width:720px;margin-inline:auto;}

.eyebrow{
  font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--accent);display:flex;align-items:center;gap:8px;
}
.lede{color:var(--text-muted);font-style:italic;font-size:17px;margin-top:12px;max-width:60ch;}
.hint{font-size:14px;color:var(--text-muted);font-style:italic;margin-top:5px;}

/* ---------- knoppen ---------- */
.btn{
  appearance:none;-webkit-appearance:none;border:none;cursor:pointer;border-radius:999px;
  min-height:48px;padding:12px 22px;font-weight:700;font-size:16px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .08s ease,filter .15s ease,background .15s ease;
}
.btn:active{transform:scale(.97);}
.btn-primary,.btn-accent{background:var(--accent);color:var(--on-accent);}
.btn-primary:hover,.btn-accent:hover{filter:brightness(1.06);}
.btn-primary:disabled{opacity:.35;cursor:not-allowed;}
.btn-ghost{background:transparent;color:#fff;border:2px solid var(--border);}
.btn-ghost:hover{background:var(--surface);}
.btn:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.gear:focus-visible{
  outline:3px solid #fff;outline-offset:2px;
}

/* ---------- onderbalk (vast, boven de home-indicator) ---------- */
.navbar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  display:flex;align-items:center;gap:10px;
  padding:12px max(16px,calc((100% - 720px) / 2)) calc(12px + env(safe-area-inset-bottom));
  background:rgba(1,58,64,.94);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-top:2px solid var(--border);
}
.navbar .btn{padding-inline:18px;}
.progress-text{flex:1;text-align:center;font-size:13px;line-height:1.25;color:var(--text-muted);font-style:italic;}

/* ---------- intro ---------- */
.intro-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:26px;}
@media (max-width:760px){.intro-grid{grid-template-columns:1fr;}}
.startpoints{display:grid;gap:10px;align-content:start;}
.startpoint{
  background:var(--surface-2);border:1.5px solid var(--border-soft);
  border-radius:var(--radius-m);padding:14px 16px;display:flex;gap:12px;align-items:flex-start;
}
.startpoint svg{flex:none;margin-top:2px;}
.startpoint b{display:block;font-size:16px;font-weight:600;}
.startpoint span{color:var(--text-muted);font-size:14px;font-style:italic;}
.install-hint{
  margin-top:16px;padding:12px 14px;border-radius:var(--radius-m);
  background:var(--surface-warm);border:1.5px solid var(--accent);font-size:14px;color:#fff;
}
.install-hint b{color:var(--accent);}
.intro-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;}

/* ---------- formulier ---------- */
label.field{display:block;margin-top:18px;}
label.field .lbl{font-weight:600;font-size:15px;display:flex;gap:6px;}
label.field .req{color:var(--accent);}
input[type=text],select,textarea{
  width:100%;margin-top:6px;padding:12px 14px;min-height:48px;
  border:2px solid var(--border-soft);border-radius:12px;
  background:var(--bg);color:#fff;font-family:inherit;font-size:16px;
}
input[type=text]:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;}
input::placeholder,textarea::placeholder{color:#7FB5B8;font-style:italic;}
textarea{resize:vertical;min-height:84px;}
input[type=number]{
  background:var(--bg);color:#fff;border:2px solid var(--border-soft);border-radius:10px;
  font-family:inherit;font-size:16px;padding:8px 10px;min-height:44px;
}

/* ---------- vragen ---------- */
.topic-head{display:flex;align-items:center;gap:14px;margin-bottom:8px;}
.topic-icon{
  width:54px;height:54px;border-radius:50%;flex:none;background:var(--primary);color:#fff;
  display:grid;place-items:center;
}
.topic-icon svg{width:26px;height:26px;}
.topic-title{font-size:clamp(19px,5vw,23px);font-weight:500;line-height:1.2;}
.topic-sub{color:var(--text-muted);font-size:14px;font-style:italic;}

.question{border-top:1px solid var(--border-soft);padding-block:24px;}
.question:first-of-type{border-top:none;padding-top:10px;}
.q-id{
  display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;
  background:var(--accent);color:var(--on-accent);font-weight:700;font-size:12px;margin-right:10px;
  vertical-align:middle;
}
.q-text{font-size:17px;font-weight:600;line-height:1.35;vertical-align:middle;}
.options{display:grid;gap:10px;margin-top:16px;}
.option{
  display:flex;align-items:flex-start;gap:12px;min-height:52px;
  border:2px solid var(--border-soft);border-radius:var(--radius-m);
  padding:14px 16px;cursor:pointer;background:var(--surface-2);
  transition:border-color .15s ease,background .15s ease;
}
.option:active{background:var(--surface);}
.option input,.checkbox-row input{
  appearance:none;-webkit-appearance:none;width:24px;height:24px;margin:0;flex:none;
  border:2px solid #7FD6CD;background:transparent;display:grid;place-content:center;
}
.option input{border-radius:50%;margin-top:0;}
.option input:checked{border-color:var(--accent);}
.option input:checked::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--accent);}
.checkbox-row input{border-radius:7px;}
.checkbox-row input:checked{background:var(--accent);border-color:var(--accent);}
.checkbox-row input:checked::after{content:"";width:6px;height:12px;border:solid var(--on-accent);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px);}
.option.selected{background:var(--primary);border-color:var(--accent);}
.option .opt-text{font-size:16px;line-height:1.4;color:#fff;}
.option.unknown{border-style:dashed;}
.option.unknown .opt-text{color:var(--text-muted);font-style:italic;}
.option.unknown.selected .opt-text{color:#fff;}

.toelicht-toggle{
  margin-top:12px;background:none;border:none;color:var(--accent);min-height:44px;
  font-weight:600;font-size:15px;cursor:pointer;padding:6px 0;
}
.toelicht-box{margin-top:2px;}

.extra-field{
  margin-top:18px;padding:16px;background:var(--surface-2);
  border-radius:var(--radius-m);border:1.5px solid var(--border-soft);
}
.extra-field .lbl{font-weight:600;font-size:15px;}
.checkbox-grid{display:grid;gap:4px;margin-top:10px;}
.checkbox-row{display:flex;align-items:center;gap:12px;font-size:16px;min-height:44px;}

/* ---------- overzicht ---------- */
.overview-row{display:flex;align-items:center;gap:12px;padding:14px 4px;border-top:1px solid var(--border-soft);min-height:64px;}
.overview-row:first-child{border-top:none;}
.overview-topic{width:38px;height:38px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;flex:none;}
.overview-bar-track{flex:1;height:10px;border-radius:999px;background:var(--bg);overflow:hidden;}
.overview-bar-fill{height:100%;background:var(--secondary);border-radius:999px;}
.overview-count{font-size:13px;color:var(--text-muted);width:48px;text-align:right;font-variant-numeric:tabular-nums;}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap;}
.pill-warn{background:var(--surface-warm);color:var(--warn-ink);}
.pill-ok{background:var(--bg);color:var(--secondary);}
@media (max-width:480px){.overview-count{display:none;}}

.signal-box{
  background:var(--critical-bg);border:1.5px solid var(--critical);
  border-radius:var(--radius-m);padding:14px 16px;margin-top:16px;display:flex;gap:12px;
}
.signal-box svg{flex:none;color:var(--critical);margin-top:2px;}
.signal-box p{font-size:15px;}

/* ---------- resultaat ---------- */
.result-hero{
  background:var(--primary);color:#fff;border-radius:var(--radius-l);padding:28px;
  display:grid;grid-template-columns:1fr auto;gap:22px;align-items:center;
}
@media (max-width:640px){.result-hero{grid-template-columns:1fr;padding:22px 20px;}}
.result-hero .eyebrow{color:var(--accent);}
.result-hero h1{color:#fff;font-size:clamp(26px,6.5vw,36px);font-weight:500;margin-top:8px;}
.result-hero p{color:#E3F5F4;margin-top:12px;max-width:56ch;font-size:16px;}
.score-dial{
  width:132px;height:132px;border-radius:50%;background:var(--accent);color:var(--on-accent);
  display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;justify-self:center;
}
.score-dial .num{font-size:38px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;}
.score-dial .lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-top:4px;}
.band-note{margin-top:16px;background:rgba(1,58,64,.4);border-radius:var(--radius-s);padding:12px 14px;font-size:15px;color:#fff;}

.section-title{font-size:20px;font-weight:500;margin-bottom:16px;display:flex;align-items:center;gap:10px;}

.bars{display:grid;gap:16px;}
.bar-row{display:grid;grid-template-columns:210px 1fr 56px;gap:14px;align-items:center;}
@media (max-width:600px){.bar-row{grid-template-columns:1fr auto;gap:6px 10px;}.bar-row .bar-label{grid-column:1 / -1;}}
.bar-label{font-size:15px;font-weight:600;display:flex;align-items:center;gap:10px;line-height:1.25;}
.bar-label .ic{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;flex:none;}
.bar-label .ic svg{width:16px;height:16px;}
.bar-track{height:14px;border-radius:999px;background:var(--bg);position:relative;overflow:hidden;}
.bar-fill{height:100%;border-radius:999px;background:var(--secondary);}
.bar-val{font-variant-numeric:tabular-nums;font-weight:700;font-size:16px;text-align:right;}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media (max-width:700px){.two-col{grid-template-columns:1fr;}}
.two-col > .card + .card{margin-top:0;}

.attn-item,.strong-item{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--border-soft);}
.attn-item:first-child,.strong-item:first-child{border-top:none;}
.attn-item svg{color:var(--accent);flex:none;margin-top:2px;}
.strong-item svg{color:var(--secondary);flex:none;margin-top:2px;}
.attn-item b,.strong-item b{font-size:16px;font-weight:600;display:block;}
.attn-item span,.strong-item span{font-size:14px;color:var(--text-muted);}

.meta-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px;}
@media (max-width:600px){.meta-grid{grid-template-columns:1fr 1fr;}}
.meta-tile{background:var(--surface-2);border:1.5px solid var(--border-soft);border-radius:var(--radius-s);padding:10px 12px;}
.meta-tile .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700;}
.meta-tile .v{font-size:15px;font-weight:600;margin-top:2px;overflow-wrap:anywhere;}
.result-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;}
@media (max-width:480px){.result-actions .btn{width:100%;}}

/* ---------- instellingen ---------- */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;display:flex;justify-content:flex-end;}
.drawer{
  width:min(440px,100%);background:var(--surface);height:100%;overflow-y:auto;
  border-left:2px solid var(--border);
  padding:calc(24px + env(safe-area-inset-top)) 24px calc(32px + env(safe-area-inset-bottom));
}
.drawer .lede{margin-top:8px;font-size:16px;}
.drawer-close{
  float:right;background:var(--surface-2);border:2px solid var(--border);border-radius:50%;
  width:44px;height:44px;cursor:pointer;color:#fff;font-size:16px;
}
.settings-group{margin-top:22px;padding-top:18px;border-top:1px solid var(--border-soft);}
.settings-group h4{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);font-weight:700;}
.settings-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;}
.settings-row label{font-size:15px;flex:1;}
.settings-row input{width:88px;text-align:right;margin-top:0;}

.toast{
  position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--accent);color:var(--on-accent);padding:12px 20px;border-radius:999px;
  font-size:15px;font-weight:700;z-index:50;max-width:calc(100% - 32px);text-align:center;
  opacity:0;pointer-events:none;transition:opacity .25s ease;
}
.toast.show{opacity:1;}

@media (prefers-reduced-motion:reduce){*{transition:none !important;}}

@media print{
  :root{--bg:#fff;--surface:#fff;--surface-2:#f2f2f2;--surface-warm:#f2f2f2;--text:#000;--text-muted:#333;--border:#888;--border-soft:#bbb;--primary:#333;--secondary:#333;--accent:#555;--on-accent:#fff;--critical:#900;--critical-bg:#fff;}
  body{color:#000;padding:0;}
  .topbar,.navbar,.result-actions,.no-print,.toast{display:none !important;}
  .card,.result-hero{break-inside:avoid;}
  .result-hero,.score-dial,.bar-fill,.step,.topic-icon,.bar-label .ic{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
}

</style>
</head>

<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

  /* =========================================================
     SCORING ENGINE
  ========================================================= */
  function topicQuestions(topicId){ return QUESTIONS.filter(q=>q.topic===topicId); }

  function rawTopicPoints(topicId, bound){
    // bound: null (only answered), 0 (missing->0), 2 (missing->2)
    let sum = 0;
    topicQuestions(topicId).forEach(q=>{
      const a = state.answers[q.id];
      if(a.status==="beantwoord"){ sum += a.points; }
      else if(bound!==null){ sum += bound; }
    });
    return sum;
  }

  function topicPercent(topicId, bound){
    const max = TOPIC_MAP[topicId].max;
    return (rawTopicPoints(topicId, bound) / max) * 100;
  }

  function totalScore(bound){
    const perc = TOPICS.map(t=>topicPercent(t.id, bound));
    return perc.reduce((a,b)=>a+b,0) / perc.length;
  }

  function missingCount(){
    return QUESTIONS.filter(q=>state.answers[q.id].status!=="beantwoord").length;
  }

  function isComplete(){ return missingCount()===0; }

  function pointsOf(qid){
    const a = state.answers[qid];
    return a.status==="beantwoord" ? a.points : null;
  }

  // Decision procedure (sectie 6/7.3), executed only when isComplete()
  function computeAdvice(){
    const total = totalScore(null);
    const aRaw = rawTopicPoints("A", null);
    const a1 = pointsOf("A1");
    const failedGedeeld = (aRaw < CONFIG.gedeeldA_min) || (a1 < CONFIG.gedeeldA1_min);

    const diffChecks = [
      { key:"A", label:"Klantinzicht (A)", need:CONFIG.diffA_min, max:12, have:rawTopicPoints("A",null) },
      { key:"B", label:"Klantonderzoek (B)", need:CONFIG.diffB_min, max:6, have:rawTopicPoints("B",null) },
      { key:"D", label:"Klantstappen en processen (D)", need:CONFIG.diffD_min, max:6, have:rawTopicPoints("D",null) },
      { key:"E", label:"Gezamenlijke keuzes en doelen (E)", need:CONFIG.diffE_min, max:8, have:rawTopicPoints("E",null) },
      { key:"F", label:"Verantwoordelijkheid en verbeteren (F)", need:CONFIG.diffF_min, max:10, have:rawTopicPoints("F",null) }
    ];
    const failedDiffTopics = diffChecks.filter(c=>c.have < c.need);
    const guardQuestions = [
      { id:"A4", label:"Verschillende klanttypen en behoeften herkennen (A4)" },
      { id:"F2", label:"Verantwoordelijkheid formeel beleggen (F2)" },
      { id:"E4", label:"Meetbare klantdoelen vaststellen (E4)" },
      { id:"F5", label:"Bijsturen op resultaten (F5)" }
    ];
    const failedGuards = guardQuestions.filter(g=>pointsOf(g.id) < 1);
    const failedDiff = failedDiffTopics.length>0 || failedGuards.length>0;

    let code, reasons=[];
    if(total < CONFIG.startT1){
      code="develop";
    } else if(failedGedeeld){
      code="develop";
      if(aRaw < CONFIG.gedeeldA_min) reasons.push("Klantinzicht (A) heeft "+aRaw+" van 12 punten; nodig is minimaal "+CONFIG.gedeeldA_min+".");
      if(a1 < CONFIG.gedeeldA1_min) reasons.push("De vraag over het vastleggen en delen van klantkennis (A1) heeft 0 punten.");
    } else if(total < CONFIG.startT2){
      code="improve";
    } else if(failedDiff){
      code="improve";
      failedDiffTopics.forEach(c=>reasons.push(c.label+" heeft "+c.have+" van "+c.max+" punten; nodig is minimaal "+c.need+"."));
      failedGuards.forEach(g=>reasons.push(g.label+" heeft 0 punten."));
    } else {
      code="differentiate";
    }

    // tegenstrijdigheid signal
    const contradiction = (pointsOf("E4")===0) && (pointsOf("F5")>=1);

    return { total, code, reasons, contradiction, failedGedeeld, failedDiff, aRaw, a1 };
  }

  function attentionPoints(advice){
    const items = [];
    // 1. reasons that changed the advice
    advice.reasons.slice(0,3).forEach(r=>items.push({title:"Voorwaarde ontbreekt", detail:r}));
    if(items.length>=3) return items.slice(0,3);

    // 2. overige onderwerpen met laagste percentages (niet perfect, order A-F for ties)
    const perc = TOPICS.map(t=>({ id:t.id, pct:topicPercent(t.id,null) }));
    perc.sort((a,b)=> a.pct-b.pct || (a.id<b.id?-1:1));
    for(const p of perc){
      if(items.length>=3) break;
      if(p.pct>=100) continue; // already maximal, not an attention point
      // avoid duplicate topic already referenced in reasons text
      const already = advice.reasons.some(r=>r.includes("("+p.id+")") || r.includes(p.id+")"));
      if(already) continue;
      const qs = topicQuestions(p.id).filter(q=>pointsOf(q.id)!==null);
      let lowestQ = null;
      qs.forEach(q=>{ const pts = pointsOf(q.id); if(lowestQ===null || pts < pointsOf(lowestQ.id)) lowestQ = q; });
      if(lowestQ){
        items.push({ title: TOPIC_MAP[p.id].title, detail: TOPIC_MAP[p.id].action });
      }
    }
    return items.slice(0,3);
  }

  function strongBuildingBlocks(){
    return QUESTIONS.filter(q=>pointsOf(q.id)===2).map(q=>({ id:q.id, topic:q.topic, text:q.text }));
  }

  function optionRow(q, val, label){
    const a = state.answers[q.id];
    const selected = a.status==="beantwoord" && a.points===val;
    const isUnknown = val==="unknown";
    const row = el("label",{class:"option"+(selected?" selected":"")+(isUnknown?" unknown":"")});
    const input = el("input",{type:"radio", name:"q-"+q.id});
    if(selected) input.checked = true;
    input.addEventListener("change", ()=>{
      if(isUnknown){ a.status="weet_niet"; a.points=null; }
      else { a.status="beantwoord"; a.points=val; }
      render();
    });
    row.appendChild(input);
    row.appendChild(el("span",{class:"opt-text"},[label]));
    return row;
  }

  function renderQuestion(q){
    const box = el("div",{class:"question"});
    const head = el("p",{});
    head.appendChild(el("span",{class:"q-id"},[q.id]));
    head.appendChild(el("span",{class:"q-text"},[q.text]));
    box.appendChild(head);

    const opts = el("div",{class:"options"});
    opts.appendChild(optionRow(q,0,q.o0));
    opts.appendChild(optionRow(q,1,q.o1));
    opts.appendChild(optionRow(q,2,q.o2));
    opts.appendChild(optionRow(q,"unknown","Weet ik niet"));
    box.appendChild(opts);

    const isOpen = !!state.toelichtOpen[q.id];
    const toggle = el("button",{class:"toelicht-toggle", onclick:()=>{ state.toelichtOpen[q.id]=!isOpen; render(); }},
      [isOpen ? "Toelichting verbergen" : "+ Toelichting toevoegen (optioneel)"]);
    box.appendChild(toggle);
    if(isOpen){
      const tbox = el("div",{class:"toelicht-box"});
      const ta = el("textarea",{placeholder:"Waar blijkt dit uit? Geef eventueel een recent voorbeeld."});
      ta.value = state.answers[q.id].toelichting;
      ta.addEventListener("input", e=>{ state.answers[q.id].toelichting = e.target.value; });
      tbox.appendChild(ta);
      box.appendChild(tbox);
    }

    if(q.extra){
      const ex = el("div",{class:"extra-field"});
      ex.appendChild(el("div",{class:"lbl"},[q.extra.label]));
      const store = state.extra[q.id];
      const grid = el("div",{class:"checkbox-grid"});
      q.extra.options.forEach(opt=>{
        const row = el("label",{class:"checkbox-row"});
        const cb = el("input",{type:"checkbox"});
        cb.checked = store.checked.includes(opt);
        cb.addEventListener("change", ()=>{
          if(cb.checked){ store.checked.push(opt); } else { store.checked = store.checked.filter(x=>x!==opt); }
        });
        row.appendChild(cb);
        row.appendChild(document.createTextNode(opt));
        grid.appendChild(row);
      });
      ex.appendChild(grid);
      if(q.extra.optionalText){
        const ti = el("input",{type:"text", placeholder:q.extra.optionalText, style:"margin-top:10px;"});
        ti.value = store.other;
        ti.addEventListener("input", e=>store.other = e.target.value);
        ex.appendChild(ti);
      }
      ex.appendChild(el("div",{class:"hint", style:"margin-top:8px;"},[q.extra.note]));
      box.appendChild(ex);
    }
    return box;
  }

    const metaCard = el("div",{class:"card", style:"margin-top:16px;"});
    metaCard.appendChild(el("div",{class:"section-title"},["Gegevens van deze beoordeling"]));
    const grid = el("div",{class:"meta-grid"});
    const items = [
      ["Organisatie", state.org.naam || "—"],
      ["Rol invuller", state.org.rol || "—"],
      ["Invulwijze", state.org.invulwijze || "—"],
      ["Datum", new Date().toLocaleDateString("nl-NL",{day:"numeric",month:"long",year:"numeric"})],
      ["Vragenlijstversie", CONFIG.vragenlijstVersion],
      ["Scoremodelversie", CONFIG.modelVersion]
    ];
    items.forEach(([k,v])=>grid.appendChild(el("div",{class:"meta-tile"},[el("div",{class:"k"},[k]), el("div",{class:"v"},[v])])));
    metaCard.appendChild(grid);
    metaCard.appendChild(el("p",{class:"hint", style:"margin-top:12px;"},["Dit is een onderbouwde zelfbeoordeling en een vertrekpunt voor het intakegesprek — geen gevalideerd meetinstrument. Bespreek de onderbouwing tijdens de intake."]));

    const actions = el("div",{class:"result-actions no-print"});
    actions.appendChild(el("button",{class:"btn btn-accent", html:ICONS.download+" Bewaar of deel samenvatting", onclick:()=>downloadSummary(advice)}));
    actions.appendChild(el("button",{class:"btn btn-ghost", html:ICONS.print+" Afdrukken", onclick:()=>window.print()}));
    actions.appendChild(el("button",{class:"btn btn-ghost", onclick:()=>goTo("overview")},["Antwoorden wijzigen"]));
    actions.appendChild(el("button",{class:"btn btn-ghost", onclick:newScan},["Nieuwe scan"]));
    metaCard.appendChild(actions);
    wrap.appendChild(metaCard);

    return wrap;
  }

  async function downloadSummary(advice){
    const lines = [];
    lines.push("KLANTBEELDSCAN — Samenvatting");
    lines.push("=================================");
    lines.push("Organisatie: "+(state.org.naam||"—"));
    lines.push("Rol invuller: "+(state.org.rol||"—"));
    lines.push("Invulwijze: "+(state.org.invulwijze||"—"));
    lines.push("Datum: "+new Date().toLocaleDateString("nl-NL"));
    lines.push("");
    lines.push("Aanbevolen startpunt: "+START_ADVICE_TEXT[advice.code].label);
    lines.push(START_ADVICE_TEXT[advice.code].body);
    lines.push("");
    lines.push("Totaalscore: "+fmt1(advice.total)+" / 100");
    lines.push("");
    lines.push("Onderwerpscores:");
    TOPICS.forEach(t=>{ lines.push("  "+t.id+". "+t.title+": "+fmt1(topicPercent(t.id,null))); });
    if(advice.reasons.length){
      lines.push("");
      lines.push("Voorwaarden die het startadvies bepaalden:");
      advice.reasons.forEach(r=>lines.push("  - "+r));
    }
    lines.push("");
    lines.push("Antwoorden per vraag:");
    QUESTIONS.forEach(q=>{
      const a = state.answers[q.id];
      const val = a.status==="beantwoord" ? a.points+" punt(en)" : (a.status==="weet_niet" ? "weet ik niet" : "onbeantwoord");
      lines.push("  "+q.id+" ["+val+"] "+q.text);
      if(a.toelichting) lines.push("      Toelichting: "+a.toelichting);
    });
    const text = lines.join("\n");
    const filename = "klantbeeldscan-"+(state.org.naam||"organisatie").replace(/[^a-z0-9]+/gi,"-").toLowerCase()+".txt";
    try{
      const file = new File([text], filename, {type:"text/plain"});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:"Klantbeeldscan — samenvatting"});
        return;
      }
    }catch(err){
      if(err && err.name==="AbortError") return;
    }
    try{
      const url = URL.createObjectURL(new Blob([text], {type:"text/plain;charset=utf-8"}));
      const a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 2000);
      toast("Samenvatting gedownload");
    }catch(err){
      toast("Bewaren is niet gelukt. Probeer Afdrukken.");
    }
  }

  /* =========================================================
     SETTINGS DRAWER
  ========================================================= */
  function openSettings(){ state.settingsOpen = true; render(); }
  function closeSettings(){ state.settingsOpen = false; render(); }

  function settingsField(labelText, key, hint){
    const row = el("div",{class:"settings-row"});
    row.appendChild(el("label",{},[labelText]));
    const input = el("input",{type:"number", value:CONFIG[key]});
    input.addEventListener("change", e=>{
      const v = parseFloat(e.target.value);
      if(!isNaN(v)){ CONFIG[key]=v; saveConfig(CONFIG); render(); toast("Instelling bijgewerkt"); }
    });
    row.appendChild(input);
    const wrap = el("div",{},[row]);
    if(hint) wrap.appendChild(el("div",{class:"hint"},[hint]));
    return wrap;
  }

  function renderSettingsDrawer(){
    const backdrop = el("div",{class:"backdrop no-print", onclick:(e)=>{ if(e.target===backdrop) closeSettings(); }});
    const drawer = el("div",{class:"drawer"});
    drawer.appendChild(el("button",{class:"drawer-close", html:"✕", onclick:closeSettings}));
    drawer.appendChild(el("h3",{},["Instellingen: grenswaarden"]));
    drawer.appendChild(el("p",{class:"lede"},["Dit zijn voorlopige ontwerpgrenzen. Pas ze aan zonder de vragen opnieuw te bouwen — bijvoorbeeld na ervaring met praktijkcases. Wijzigingen worden lokaal op dit apparaat onthouden en gelden direct voor het huidige resultaat."]));

    const g1 = el("div",{class:"settings-group"});
    g1.appendChild(el("h4",{},["Eerste startadvies"]));
    g1.appendChild(settingsField("Ondergrens 'Klantbediening verbeteren'", "startT1", "Totaalscore lager dan deze grens → Klantbeeld ontwikkelen."));
    g1.appendChild(settingsField("Ondergrens 'Klantbediening differentiëren'", "startT2", "Totaalscore vanaf deze grens → mogelijk differentiëren."));
    drawer.appendChild(g1);

    const g2 = el("div",{class:"settings-group"});
    g2.appendChild(el("h4",{},["Voldoende gedeeld klantbeeld"]));
    g2.appendChild(settingsField("Minimum op Klantinzicht (A), van 12", "gedeeldA_min"));
    g2.appendChild(settingsField("Minimum op vraag A1 (delen van klantkennis)", "gedeeldA1_min"));
    drawer.appendChild(g2);

    const g3 = el("div",{class:"settings-group"});
    g3.appendChild(el("h4",{},["Voorwaarden voor differentiëren"]));
    g3.appendChild(settingsField("Minimum Klantinzicht (A), van 12", "diffA_min"));
    g3.appendChild(settingsField("Minimum Klantonderzoek (B), van 6", "diffB_min"));
    g3.appendChild(settingsField("Minimum Klantstappen/processen (D), van 6", "diffD_min"));
    g3.appendChild(settingsField("Minimum Gezamenlijke keuzes en doelen (E), van 8", "diffE_min"));
    g3.appendChild(settingsField("Minimum Verantwoordelijkheid en verbeteren (F), van 10", "diffF_min"));
    g3.appendChild(el("p",{class:"hint", style:"margin-top:10px;"},["Daarnaast moeten A4, F2, E4 en F5 elk minimaal 1 punt hebben — dit is vast onderdeel van de logica."]));
    drawer.appendChild(g3);

    const g4 = el("div",{class:"settings-group"});
    g4.appendChild(el("button",{class:"btn btn-ghost", onclick:()=>{ CONFIG = Object.assign({}, DEFAULT_CONFIG); saveConfig(CONFIG); render(); toast("Standaardwaarden hersteld"); }},["Terugzetten naar standaardwaarden"]));
    g4.appendChild(el("button",{class:"btn btn-ghost", style:"margin-top:12px;", onclick:newScan},["Nieuwe scan starten (wist antwoorden)"]));
    drawer.appendChild(g4);

    backdrop.appendChild(drawer);
    return backdrop;
  }

  /* =========================================================
     MAIN RENDER
  ========================================================= */
  let navUpdater = null;
  function updateNav(){ if(navUpdater) navUpdater(); }

  function render(){
    const keepY = window.scrollY;
    app.innerHTML = "";
    app.appendChild(renderTopbar());

    const name = screenName();
    let content, navOpts;

    if(name==="intro"){
      content = screenIntro();
      app.appendChild(content);
      document.title = "Klantbeeldscan";
    } else if(name==="orgdata"){
      content = screenOrgData();
      app.appendChild(content);
      const nav = renderNav({
        onBack:()=>go(-1),
        onNext:()=>{ if(orgComplete()) go(1); },
        nextDisabled: !orgComplete(),
        progress:"Stap 2 van "+SCREENS.length
      });
      navUpdater = ()=>{ const btn = nav.querySelector(".btn-primary"); btn.disabled = !orgComplete(); };
      app.querySelector(".center-col").after(nav);
    } else if(name.startsWith("block-")){
      const topicId = name.split("-")[1];
      content = screenBlock(topicId);
      app.appendChild(content);
      const idx = SCREENS.indexOf(name);
      const nav = renderNav({
        onBack:()=>go(-1),
        onNext:()=>go(1),
        progress:"Onderwerp "+topicId+" · "+SCREENS.indexOf(name)+" / "+(SCREENS.length-1)
      });
      app.querySelector(".center-col").after(nav);
    } else if(name==="overview"){
      content = screenOverview();
      app.appendChild(content);
      const nav = renderNav({
        onBack:()=>go(-1),
        onNext:()=>go(1),
        nextLabel: isComplete() ? "Bekijk resultaat" : "Bekijk voorlopige uitkomst",
        progress: isComplete() ? "Alle vragen beantwoord" : (TOTAL_QUESTIONS-missingCount())+" / "+TOTAL_QUESTIONS+" beantwoord"
      });
      app.querySelector(".center-col").after(nav);
    } else if(name==="results"){
      content = screenResults();
      app.appendChild(content);
    }

    if(state.settingsOpen){ app.appendChild(renderSettingsDrawer()); }
    app.classList.toggle("has-nav", name==="orgdata" || name==="overview" || name.startsWith("block-"));
    window.scrollTo(0, keepY);
    saveProgress();
  }

  render();


  if("serviceWorker" in navigator && location.protocol.startsWith("http")){
    window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
  }
})();
</script>
